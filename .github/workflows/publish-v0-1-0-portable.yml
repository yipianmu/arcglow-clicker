name: Update ArcGlow v0.1.0 release notes
on:
  push:
    branches: ['release/v0.1.0-portable']
    paths: ['.github/workflows/publish-v0-1-0-portable.yml']
permissions:
  contents: write
concurrency: arcglow-v0-1-0-release
jobs:
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Update release description
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repository="repos/$GITHUB_REPOSITORY"
          base="https://raw.githubusercontent.com/$GITHUB_REPOSITORY"
          curl -fsSL --retry 2 "$base/382e888844ad12ef3b0193846976039534efe244/release-notes.md" -o previous-notes.md
          curl -fsSL --retry 2 "$base/$GITHUB_SHA/release-notes.md" -o release-notes.md
          release=$(gh api "$repository/releases/tags/v0.1.0")
          test "$(jq -r .id <<<"$release")" = 456542993
          current=$(jq -r .body <<<"$release")
          wanted=$(cat release-notes.md)
          if [[ "$current" = "$wanted" ]]; then exit 0; fi
          if [[ "$current" != "$(cat previous-notes.md)" ]]; then
            echo "::error::Release description differs from the expected prior version."
            exit 1
          fi
          jq --null-input --rawfile body release-notes.md '{body: $body}' > release-patch.json
          result=$(gh api --method PATCH "$repository/releases/456542993" --input release-patch.json)
          test "$(jq -r .body <<<"$result")" = "$wanted"
